name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tarapp/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          cd tarapp
          npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build APK locally on GitHub Actions
        run: |
          cd tarapp
          eas build --platform android --profile preview --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_TARFLUE_URL: "https://taragent.tar-54d.workers.dev"
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: "291840005173-ggf87u7atopdohatin502o1q9gmsceq5.apps.googleusercontent.com"
          EXPO_PUBLIC_TURSO_URL: "libsql://global-tarframework.aws-eu-west-1.turso.io"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: tarapp/*.apk
