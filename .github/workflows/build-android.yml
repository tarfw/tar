name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tarapp/package-lock.json

      - name: Install dependencies
        run: |
          cd tarapp
          npm ci

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo Prebuild
        run: |
          cd tarapp
          npx expo prebuild --platform android
        env:
          EXPO_PUBLIC_TARFLUE_URL: "https://taragent.tar-54d.workers.dev"
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: "291840005173-ggf87u7atopdohatin502o1q9gmsceq5.apps.googleusercontent.com"
          EXPO_PUBLIC_TURSO_URL: "libsql://global-tarframework.aws-eu-west-1.turso.io"
          EXPO_PUBLIC_TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EXPO_PUBLIC_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Make Gradlew Executable
        run: chmod +x ./tarapp/android/gradlew

      - name: Build Release APK
        run: |
          cd tarapp/android
          ./gradlew assembleRelease

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: tarapp/android/app/build/outputs/apk/release/app-release.apk
